[package]
name = "ids-le"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Extract every UUID, ULID, NanoID, ObjectId and Snowflake, and decode the time inside"
authors = ["Nolin D Naidoo"]
homepage = "https://letools.dev/tools/ids-le"
repository = "https://github.com/nolindnaidoo/ids-le"
keywords = ["uuid", "ulid", "objectid", "extract", "cli"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# What a consumer gets, and why.
#
# Ships: src/, Cargo.toml, Cargo.lock, LICENSE, README.md — needed to
# build the binary. SPEC.md and CHANGELOG.md — the behavioural contract
# someone scripting against the exit codes needs. tests/ and fixtures/ —
# not needed to *build*, but needed to *verify*: `cargo test` on the
# unpacked tarball runs the full corpus, so the decode claims in the
# README are checkable by whoever installed it rather than taken on
# trust.
#
# Excluded: AGENTS.md and CLAUDE.md are how this repo is worked on, not
# how the tool is used. rust-toolchain.toml is a convenience for
# contributors to *this* checkout; shipped, it would pin the toolchain
# of anyone who unpacks or vendors the crate, which is not this crate's
# business.
exclude = ["AGENTS.md", "CLAUDE.md", "rust-toolchain.toml"]

[[bin]]
name = "ids-le"
path = "src/main.rs"

[dependencies]
# Three dependencies, each with the reason it earns its place. A fourth
# needs an argument in this file before it needs a line in it.
#
# The report shape *is* the API — one JSON object per line on stdout, and
# a caller scripts against it. Deriving it off the types that produce it
# is what keeps the shape and the code from drifting; hand-written
# serialization would be a second definition of the contract.
serde = { version = "1", features = ["derive"] }
# The MCP surface speaks JSON-RPC, which has to be parsed as well as
# written, and the corpus fixtures are read back as data. Writing is
# `serde`'s job; reading needs a parser, and this is serde's own.
serde_json = "1"
# The walker. `ignore` is ripgrep's, so "what this tool walks" and "what
# ripgrep walks" are the same answer — which is the answer a person
# auditing a repository already has in their head.
ignore = "0.4"

# There is deliberately no `uuid`, no `ulid`, no `bson`, no `chrono`.
#
# `uuid` was considered for the version/variant bits and rejected: those
# are two nibbles of a 36-character string, the crate reads them from
# `Uuid::get_version_num` and `get_variant` *after* refusing to construct
# anything it considers invalid, and refusing is this tool's job rather
# than its dependency's. A refusal that arrives as `Err(())` cannot carry
# the named reason the whole report is built on. Everything else — ULID's
# Crockford alphabet, ObjectId's leading four bytes, a Snowflake shift,
# and the civil-date arithmetic behind every ISO-8601 string — is under
# fifty lines each and is pinned by the corpus.

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Every output of this tool is a claim someone scripts against — a line
# number, a column, a decoded timestamp. A wrapped number is silently
# wrong data in a report whose whole value is honesty, which is worse
# than a crash — so overflow keeps panicking in release, as it does in
# debug. (Same rule as pixelcoords, pixelactions, scrape-le and urls-le.)
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate relaxations, same policy as the other crates: no inline
# #[allow] anywhere (CI enforces); anything relaxed must be listed here,
# visibly, with its reason.
#
# Nothing in this crate is a public API — it is a binary, and every item
# is `pub(crate)` or private. `#[must_use]` on an internal helper is
# noise a reader has to skip past.
must_use_candidate = "allow"
# `Result<T, String>` is the crate-wide error type and the message *is*
# the documentation; a `# Errors` section restating it on every function
# would be the same sentence twice.
missing_errors_doc = "allow"
# The handful of `expect`s in this crate are each guarded by a check in
# the same function and each names the invariant in its message — see
# AGENTS.md, "Panics". A `# Panics` section would restate the message a
# reader can already see, and would suggest the panic is reachable.
missing_panics_doc = "allow"
# The doc comments in `extract/` name real identifier schemes, and their
# real spelling is camel-case: NanoID, ObjectId, MongoDB, ULID. The lint
# reads those as Rust items someone forgot to backtick. Backticking a
# product name would make prose about the specifications read like code,
# and every one of these is prose about a specification.
doc_markdown = "allow"
