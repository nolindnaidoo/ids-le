# Contributors get the same toolchain CI uses, without being told to
# install anything. Scoped to crate/ rather than the repo root because the
# extension that will sit beside it has no business acquiring a Rust
# toolchain — the sibling repos that already have one keep it this way.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
