# The Rust CLI's CI.
#
# This repo is crate-only: there is no extension beside it yet, so the `parity`
# and `differential` jobs the two-frontend siblings run have nothing to compare
# and are deliberately absent rather than present and vacuous. They arrive with
# the extension.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a commit with
  # no way to be verified. Dispatch is the escape hatch.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
  pull_request:
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for extract/.
  # Enforced per module, not on the total: a total hides one module sliding
  # while the others carry it. Scoped to extract/ because everything else
  # is I/O verified by the contract job.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is exactly
        # when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on extract/
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 90.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          measured = 0
          for f in files:
              if "/extract/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              measured += 1
              print(f"{name:20} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          # Zero matches is not zero failures. Rename the directory and the
          # filter above stops matching, the loop never runs, and the job
          # reports success having checked nothing at all.
          if measured == 0:
              print("No modules matched the coverage filter — the job checked nothing.")
              sys.exit(1)
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in extract/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - run: cargo audit

  # Documents and directory entries that are hostile to a reader, over the
  # built binary, on a tree the test builds at runtime — Windows cannot check
  # in a FIFO, a mode-000 file, a symlink loop or a path over 260 characters,
  # and a fixture directory that cannot be created on a third of the matrix
  # silently tests nothing.
  #
  # Every case exists because something of that shape got through by hand
  # somewhere in this family: a byte-order mark read as content, a text file
  # that could not be decoded and vanished from the report rather than being
  # named, a PNG that made --strict exit 2 on any repository holding an image,
  # and a minified bundle on one very long line. Runs in a few seconds; the
  # timeout is a hang net, not the budget.
  hazards:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # --nocapture so a platform that could not express a case says so by
      # name in the log. A skipped case is never reported as a pass.
      - name: Hazardous documents and directory entries
        run: cargo test --locked --test hazards -- --nocapture

  # What the operating system does to a report, asserted rather than hoped
  # for: forward slashes in every reported path (a sibling shipped `\` on
  # Windows for a release), a walk that survives a reserved device name, a
  # case-folding filesystem that does not report one file twice, CRLF that
  # does not move a column, and a stdin refusal judged by its exit code
  # rather than by whether the parent's write won the race.
  #
  # The whole suite then runs three times, under three time zones. This
  # crate's central claim is a decode rendered as ISO-8601 **UTC**, so a
  # suite that quietly depended on the machine's zone would be right on the
  # author's desk and wrong everywhere else — and Windows ignores TZ
  # outright, which would hide it on a third of the matrix. The byte
  # identity of the three reports is asserted inside the test, where two
  # reports can actually be compared; running everything under all three is
  # what proves nothing else reads a clock.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Platform behaviour
        run: cargo test --locked --test platform -- --nocapture
      - name: The suite under a fixed time zone
        env:
          TZ: UTC
        run: cargo test --locked
      - name: The same suite with no time zone at all
        run: cargo test --locked
      - name: And under a zone fourteen hours ahead
        env:
          TZ: Pacific/Kiritimati
        run: cargo test --locked

  # A standing net over the classifier, fed runs generated at every boundary
  # it decides on: hex at every length near 24 and 32, base62 near 21,
  # Crockford carrying the four letters it excludes, ULIDs whose leading
  # character overflows a 48-bit timestamp, all 256 UUID version/variant
  # nibble pairs, and integers across the Snowflake range.
  #
  # Sixty seconds, not run to convergence — the point is that a panic, a
  # stall, or a row that names a kind when two schemes fit fails a build
  # rather than waiting to be found by a user. The seed is printed on every
  # run, so a red build reproduces from its own log.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDS_LE_FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Fuzz the classifier at its boundaries
        run: cargo test --locked --release --test fuzz -- --nocapture

  # A wall-clock ceiling and three linearity checks on a generated 500-file
  # corpus. A sibling was fifty times slower than the rest of the family for
  # a release because nothing measured it; the ceiling here is ten times a
  # local measurement recorded in the test, and four times the work may not
  # cost six times the clock — across files, across identifiers in one file,
  # and across identifiers on one non-ASCII line. The last of those is the
  # quadratic this crate actually shipped: the column index re-counted UTF-16
  # units from the line start on every lookup, so a minified bundle carrying
  # one accented character took four seconds for twenty thousand runs.
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDS_LE_BUDGET: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # One at a time: two timed runs sharing a runner measure each other
      # rather than the tool.
      - name: Wall-clock budget and linearity
        run: cargo test --locked --release --test budget -- --nocapture --test-threads=1

  # Does this crate name what it claims to name? Every kind, every refusal
  # reason, every UUID version and variant, and every format reader, each
  # reachable from a real fixture document — with the enums read out of
  # src/extract/ rather than typed into the test, so a sixth kind cannot
  # arrive without a document that produces it. It also prints the measured
  # rate at which ordinary 24-hex hashes are named ObjectIds, which SPEC.md
  # states and nothing else measures.
  #
  # The grep is the point of the marker line: `cargo test <filter>` exits 0
  # when the filter matches nothing, so a renamed or deleted test would
  # otherwise leave a green job that ran no assertions at all.
  coverage-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every kind, reason, version and format, named back from a fixture
        run: |
          set -o pipefail
          cargo test --locked --test coverage_matrix -- --nocapture | tee matrix.log
          grep -q 'coverage-matrix: complete' matrix.log

  # A gated tier is a tier that does not run. `versions-le` shipped a
  # scenarios suite that had never been executed once — it asserted a shape
  # the code stopped producing — because nothing ever set its variable.
  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: The gated scenario tier
        env:
          IDS_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1
